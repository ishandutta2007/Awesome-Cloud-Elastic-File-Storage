<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.pulsing-grid{animation:pulse 6s ease-in-out infinite;transform-origin:center}.floating-element{animation:floatNode 4s ease-in-out infinite}.moving-data{stroke-dasharray:8,8;animation:dash 2s linear infinite}</style><rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/><g class="pulsing-grid" opacity=".25"><circle cx="150" cy="80" r="120" fill="#6366f1" filter="url(#glow)"/><circle cx="1050" cy="260" r="140" fill="#ec4899" filter="url(#glow)"/><path fill="none" stroke="#4f46e5" stroke-width="1.5" d="M 0,100 Q 300,50 600,100 T 1200,100"/><path fill="none" stroke="#9333ea" stroke-width="1.5" d="M 0,220 Q 400,280 800,220 T 1200,250"/></g><g opacity=".4"><line x1="100" x2="300" y1="280" y2="280" stroke="#38bdf8" stroke-width="2"/><line x1="300" x2="450" y1="280" y2="310" stroke="#38bdf8" stroke-width="2"/><line x1="900" x2="1050" y1="70" y2="100" stroke="#a855f7" stroke-width="2"/><path fill="none" stroke="#ec4899" stroke-width="2" d="M 850,290 L 1000,280 L 1120,310" class="moving-data"/></g><g class="floating-element"><circle cx="100" cy="280" r="6" fill="#38bdf8"/><circle cx="300" cy="280" r="8" fill="#818cf8"/><circle cx="450" cy="310" r="5" fill="#38bdf8"/><circle cx="1050" cy="100" r="7" fill="#c084fc"/><circle cx="1120" cy="310" r="6" fill="#f472b6"/></g><rect width="1200" height="6" x="0" y="0" fill="url(#accentGrad)" rx="3"/><g text-anchor="middle" transform="translate(600, 155)"><rect width="280" height="32" x="-140" y="-95" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="16"/><text x="0" y="-74" class="badge-text" text-anchor="middle">⚡ CLOUD &amp; DISTRIBUTED STORAGE</text><text x="0" y="-15" class="title" text-anchor="middle">Awesome Cloud Elastic File Storage</text><text x="0" y="30" class="subtitle" text-anchor="middle">Curated Enterprise SaaS NAS &amp; Open-Source Scale-Out Distributed File Systems</text><g><g transform="translate(0, 75) translate(-240, 0)"><rect width="130" height="30" x="-65" y="-16" fill="#334155" opacity=".9" rx="15"/><text x="0" y="4" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☁️ Managed NFS</text></g><g transform="translate(0, 75) translate(-80, 0)"><rect width="150" height="30" x="-75" y="-16" fill="#334155" opacity=".9" rx="15"/><text x="0" y="4" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📂 POSIX Compliant</text></g><g transform="translate(0, 75) translate(90, 0)"><rect width="160" height="30" x="-80" y="-16" fill="#334155" opacity=".9" rx="15"/><text x="0" y="4" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Scale-Out NAS</text></g><g transform="translate(0, 75) translate(245, 0)"><rect width="120" height="30" x="-60" y="-16" fill="#334155" opacity=".9" rx="15"/><text x="0" y="4" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔓 Open-Source</text></g></g></g></svg>