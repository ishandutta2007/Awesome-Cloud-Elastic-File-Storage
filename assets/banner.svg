<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic Animation Effects */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-grid { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating-element { animation: floatNode 4s ease-in-out infinite; }
    .moving-data { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Background Grid / Micro-elements (Background ONLY) -->
  <g class="pulsing-grid" opacity="0.25">
    <circle cx="150" cy="80" r="120" fill="#6366f1" filter="url(#glow)" />
    <circle cx="1050" cy="260" r="140" fill="#ec4899" filter="url(#glow)" />
    <path d="M 0,100 Q 300,50 600,100 T 1200,100" fill="none" stroke="#4f46e5" stroke-width="1.5" />
    <path d="M 0,220 Q 400,280 800,220 T 1200,250" fill="none" stroke="#9333ea" stroke-width="1.5" />
  </g>

  <!-- Background Data Flow Network Lines -->
  <g opacity="0.4">
    <line x1="100" y1="280" x2="300" y2="280" stroke="#38bdf8" stroke-width="2" />
    <line x1="300" y1="280" x2="450" y2="310" stroke="#38bdf8" stroke-width="2" />
    <line x1="900" y1="70" x2="1050" y2="100" stroke="#a855f7" stroke-width="2" />
    <path d="M 850,290 L 1000,280 L 1120,310" fill="none" stroke="#ec4899" stroke-width="2" class="moving-data" />
  </g>

  <!-- Background Floating Network Nodes -->
  <g class="floating-element">
    <circle cx="100" cy="280" r="6" fill="#38bdf8" />
    <circle cx="300" cy="280" r="8" fill="#818cf8" />
    <circle cx="450" cy="310" r="5" fill="#38bdf8" />
    <circle cx="1050" cy="100" r="7" fill="#c084fc" />
    <circle cx="1120" cy="310" r="6" fill="#f472b6" />
  </g>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)" rx="3" />

  <!-- Main Foreground Content (Centered & Completely Unobstructed) -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Category Tag / Badge -->
    <rect x="-140" y="-95" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="-74" class="badge-text" text-anchor="middle">⚡ CLOUD &amp; DISTRIBUTED STORAGE</text>

    <!-- Main Title -->
    <text x="0" y="-15" class="title" text-anchor="middle">Awesome Cloud Elastic File Storage</text>

    <!-- Subtitle -->
    <text x="0" y="30" class="subtitle" text-anchor="middle">Curated Enterprise SaaS NAS &amp; Open-Source Scale-Out Distributed File Systems</text>

    <!-- Tech Pills -->
    <g transform="translate(0, 75)">
      <!-- Pill 1: Managed NFS -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="-16" width="130" height="30" rx="15" fill="#334155" opacity="0.9" />
        <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">☁️ Managed NFS</text>
      </g>
      <!-- Pill 2: POSIX Compliance -->
      <g transform="translate(-80, 0)">
        <rect x="-75" y="-16" width="150" height="30" rx="15" fill="#334155" opacity="0.9" />
        <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">📂 POSIX Compliant</text>
      </g>
      <!-- Pill 3: Scale-Out Architecture -->
      <g transform="translate(90, 0)">
        <rect x="-80" y="-16" width="160" height="30" rx="15" fill="#334155" opacity="0.9" />
        <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🚀 Scale-Out NAS</text>
      </g>
      <!-- Pill 4: Open-Source -->
      <g transform="translate(245, 0)">
        <rect x="-60" y="-16" width="120" height="30" rx="15" fill="#334155" opacity="0.9" />
        <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔓 Open-Source</text>
      </g>
    </g>
  </g>
</svg>
